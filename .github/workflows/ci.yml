name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is written by npm 11; the npm that ships with Node 22 reads it as out of sync
      - run: npm install -g npm@11

      - name: Install
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "::error::npm ci failed: $(head -n 10 install.log | tr '\n' ' ')"; fi
          exit "$status"

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The browser tests build the app themselves and fake the AI and photo endpoints, so no secrets are needed.
      # They use the Google Chrome that GitHub's Ubuntu runners already have.
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
